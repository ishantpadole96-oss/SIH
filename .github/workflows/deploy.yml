name: Deploy RuralCare to GitHub Pages & CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17 for Android Build
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Dependencies
        run: |
          npm install
          npm --prefix server install
          npm --prefix client install

      - name: Seed SQLite Database
        run: node server/database/seed.js

      - name: Run Backend Automated Smoke Tests
        run: node server/scripts/test-api.js

      - name: Build Vite Production Web App
        run: npm run build

      - name: Build Android WebView APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon || true
          cd ..
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk client/dist/ruralcare.apk
            echo "Successfully updated client/dist/ruralcare.apk with freshly compiled APK"
          fi
        continue-on-error: true

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ruralcare-android-apk
          path: client/dist/ruralcare.apk
        continue-on-error: true

      - name: Upload GitHub Pages Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy-pages:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
