<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/ruralcare-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#195B48" />
    <meta name="description" content="RuralCare connects rural citizens, healthcare workers, doctors, and administrators across all 36 districts of Maharashtra to make public healthcare easier to find and act on." />
    <title>RuralCare — Connected care, closer | Maharashtra Government Healthcare Platform</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Space+Grotesk:wght@500;600;700&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
      @keyframes rcPulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.04); opacity: 0.92; }
      }
      @keyframes rcBar {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(30%); width: 65%; }
        100% { transform: translateX(190%); width: 45%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #F4F7F5; font-family: 'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; padding: 2rem; text-align: center;">
        <div style="width: 84px; height: 84px; border-radius: 24px; background: #FFFFFF; border: 1.5px solid #A7DBBB; box-shadow: 0 10px 25px -4px rgba(17, 50, 42, 0.12); display: flex; align-items: center; justify-content: center; margin-bottom: 1.25rem; animation: rcPulse 2s infinite ease-in-out;">
          <img src="/ruralcare-mark.png" alt="RuralCare Logo" style="width: 52px; height: 52px; object-fit: contain;" />
        </div>
        <div style="font-size: 1.85rem; font-weight: 800; color: #11322A; letter-spacing: -0.025em; line-height: 1.1; margin-bottom: 0.35rem;">
          Rural<span style="color: #0D9488;">Care</span>
        </div>
        <div style="font-size: 0.88rem; font-weight: 600; color: #52786D; margin-bottom: 1.75rem;">
          Connected care, closer • महाराष्ट्र शासन आरोग्य मंच
        </div>
        <div style="width: 160px; height: 4px; background: #E2ECE5; border-radius: 9999px; overflow: hidden; position: relative;">
          <div style="width: 45%; height: 100%; background: linear-gradient(90deg, #0D9488, #2DD4BF); border-radius: 9999px; animation: rcBar 1.4s infinite ease-in-out;"></div>
        </div>
        <div style="margin-top: 1rem; font-size: 0.76rem; color: #9CA3AF; font-weight: 500;">
          Loading Maharashtra Healthcare Network across 36 Districts...
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
